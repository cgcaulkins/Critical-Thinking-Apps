  <!-- Application Logic & Scripts -->
  <script>
    // State management
    const state = {
      currentStep: 1,
      maxReachedStep: 1,
      targetCount: 4,
      items: [],
      pairs: [],
      currentPairIndex: 0,
      scores: {},
      history: [],
      soundEnabled: true,
      finalRankedList: null,
      lastFocusedElement: null
    };

    // Web Audio Synthesizer (Zero external audio file dependencies)
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!state.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'voteA') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12); // A5
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'voteB') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, now); // E5
          osc.frequency.exponentialRampToValueAtTime(987.77, now + 0.12); // B5
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'tie') {
          [440, 554.37].forEach((freq) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
          });
        } else if (type === 'undo') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.14);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const noteStart = now + (idx * 0.08);
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.15, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(noteStart);
            osc.stop(noteStart + 0.36);
          });
        }
      } catch (e) {
        // Fallback gracefully if audio is prevented
      }
    }

    // Accessible Audio Toggle
    function toggleAudio() {
      state.soundEnabled = !state.soundEnabled;
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const soundStatusText = document.getElementById('soundStatusText');
      const soundIcon = document.getElementById('soundIcon');

      soundToggleBtn.setAttribute('aria-pressed', state.soundEnabled ? 'true' : 'false');

      if (state.soundEnabled) {
        soundStatusText.textContent = "Sound On";
        soundToggleBtn.setAttribute('aria-label', 'Sound effects are enabled. Click to mute sound.');
        soundIcon.innerHTML = `
          <svg class="w-4 h-4 text-emerald-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          </svg>
        `;
        announceLive("Sound effects unmuted");
        playSound('voteA');
      } else {
        soundStatusText.textContent = "Muted";
        soundToggleBtn.setAttribute('aria-label', 'Sound effects are muted. Click to enable sound.');
        soundIcon.innerHTML = `
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
          </svg>
        `;
        announceLive("Sound effects muted");
      }
    }

    // ARIA Live Announcers
    function announceLive(message) {
      const liveRegion = document.getElementById('sr-announcements');
      if (liveRegion) {
        liveRegion.textContent = '';
        setTimeout(() => {
          liveRegion.textContent = message;
        }, 50);
      }
    }

    function announceAlert(message) {
      const alertRegion = document.getElementById('sr-alerts');
      if (alertRegion) {
        alertRegion.textContent = '';
        setTimeout(() => {
          alertRegion.textContent = message;
        }, 50);
      }
    }

    // Toast alert handlers
    function showToast(message) {
      const toast = document.getElementById('toastMessage');
      const text = document.getElementById('toastText');
      text.textContent = message;
      toast.classList.remove('hidden');
      announceAlert(message);
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 5000);
    }

    function dismissToast() {
      document.getElementById('toastMessage').classList.add('hidden');
    }

    // Folder Tab Switching
    function updateFolderTabs(activeStep) {
      state.currentStep = activeStep;
      if (activeStep > state.maxReachedStep) {
        state.maxReachedStep = activeStep;
      }

      for (let i = 1; i <= 4; i++) {
        const tabBtn = document.getElementById(`tab-btn-${i}`);
        const section = document.getElementById(`step-${i}`);

        if (i === activeStep) {
          tabBtn.className = "folder-tab tab-active";
          tabBtn.setAttribute('aria-selected', 'true');
          tabBtn.setAttribute('tabindex', '0');
          section.classList.remove('hidden');
        } else {
          section.classList.add('hidden');
          tabBtn.setAttribute('aria-selected', 'false');
          tabBtn.setAttribute('tabindex', '-1');

          if (i <= state.maxReachedStep) {
            tabBtn.className = "folder-tab tab-completed tab-interactive";
          } else {
            tabBtn.className = "folder-tab opacity-75";
          }
        }
      }
    }

    function handleTabClick(stepNumber) {
      if (stepNumber <= state.maxReachedStep) {
        if (stepNumber === 1) goToStep1();
        else if (stepNumber === 2) goToStep2();
        else if (stepNumber === 3 && state.items.length >= 2) goToStep3();
        else if (stepNumber === 4 && state.finalRankedList) goToStep4();
      }
    }

    // Modal Dialog Handlers
    function openModal(dialogId) {
      state.lastFocusedElement = document.activeElement;
      const modal = document.getElementById(dialogId);
      if (modal && typeof modal.showModal === 'function') {
        modal.showModal();
      }
    }

    function closeModal(dialogId) {
      const modal = document.getElementById(dialogId);
      if (modal && typeof modal.close === 'function') {
        modal.close();
      }
      if (state.lastFocusedElement) {
        state.lastFocusedElement.focus();
      }
    }

    // Step 1: Count logic
    const itemCountInput = document.getElementById('itemCountInput');
    const matchupEstimate = document.getElementById('matchupEstimate');

    function calculateTotalPairs(n) {
      return (n * (n - 1)) / 2;
    }

    function updateMatchupEstimate() {
      const val = parseInt(itemCountInput.value, 10);
      if (!isNaN(val) && val >= 3) {
        const total = calculateTotalPairs(val);
        matchupEstimate.textContent = `${val} items will generate ${total} pairwise comparison${total === 1 ? '' : 's'}.`;
      } else {
        matchupEstimate.textContent = 'Please specify at least 3 items.';
      }
    }

    function adjustCount(delta) {
      let current = parseInt(itemCountInput.value, 10) || 3;
      current = Math.min(Math.max(3, current + delta), 20);
      itemCountInput.value = current;
      updateMatchupEstimate();
    }

    function setQuickCount(count) {
      itemCountInput.value = count;
      updateMatchupEstimate();
    }

    itemCountInput.addEventListener('input', updateMatchupEstimate);

    function goToStep1() {
      updateFolderTabs(1);
      announceLive("Returned to Step 1: Item Setup & Count");
    }

    function goToStep2() {
      const count = parseInt(itemCountInput.value, 10);
      if (isNaN(count) || count < 3) {
        showToast('Please specify a valid item count (minimum 3 items).');
        return;
      }
      if (count > 20) {
        showToast('Maximum item count is 20 to preserve comparison feasibility.');
        return;
      }

      state.targetCount = count;
      renderItemInputRows(count);
      updateFolderTabs(2);
      announceLive(`Step 2: Enter names for your ${count} items.`);

      setTimeout(() => {
        const first = document.getElementById('item-input-0');
        if (first) first.focus();
      }, 60);
    }

    // Step 2: Item Entry
    const manualContainer = document.getElementById('manualInputContainer');
    const bulkContainer = document.getElementById('bulkInputContainer');
    const bulkTextarea = document.getElementById('bulkTextarea');

    function renderItemInputRows(count) {
      manualContainer.innerHTML = '';
      const existing = state.items;

      for (let i = 0; i < count; i++) {
        const row = document.createElement('div');
        row.className = 'flex items-center space-x-2.5';
        
        const existingVal = existing[i] ? existing[i].replace(/"/g, '&quot;') : '';

        row.innerHTML = `
          <label for="item-input-${i}" class="w-8 h-8 rounded-xl bg-slate-200 text-slate-800 font-bold text-xs flex items-center justify-center shrink-0">
            ${i + 1}
          </label>
          <input 
            type="text" 
            id="item-input-${i}" 
            data-index="${i}" 
            value="${existingVal}"
            aria-label="Item number ${i + 1}"
            placeholder="e.g., Option ${i + 1}" 
            class="item-text-field flex-grow px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-700 text-sm font-semibold text-slate-900 transition"
          />
        `;
        manualContainer.appendChild(row);
      }

      const inputs = manualContainer.querySelectorAll('input');
      inputs.forEach((input, idx) => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (idx + 1 < inputs.length) {
              inputs[idx + 1].focus();
            } else {
              startComparisonProcess();
            }
          }
        });
      });
    }

    function switchInputMode(mode) {
      const tabManual = document.getElementById('tabManual');
      const tabPaste = document.getElementById('tabPaste');
      
      if (mode === 'manual') {
        manualContainer.classList.remove('hidden');
        bulkContainer.classList.add('hidden');
        tabManual.className = "px-4 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition";
        tabPaste.className = "px-4 py-2 rounded-lg text-slate-700 hover:text-slate-950 transition";
        tabManual.setAttribute('aria-pressed', 'true');
        tabPaste.setAttribute('aria-pressed', 'false');
      } else {
        manualContainer.classList.add('hidden');
        bulkContainer.classList.remove('hidden');
        tabPaste.className = "px-4 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition";
        tabManual.className = "px-4 py-2 rounded-lg text-slate-700 hover:text-slate-950 transition";
        tabPaste.setAttribute('aria-pressed', 'true');
        tabManual.setAttribute('aria-pressed', 'false');
        
        const currentInputs = Array.from(document.querySelectorAll('.item-text-field')).map(inp => inp.value.trim());
        bulkTextarea.value = currentInputs.filter(Boolean).join('\n');
      }
    }

    function parseBulkInput() {
      const lines = bulkTextarea.value.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length < 3) {
        showToast('Please provide at least 3 items (one item per line).');
        return;
      }
      state.targetCount = lines.length;
      itemCountInput.value = lines.length;
      updateMatchupEstimate();
      state.items = lines;
      renderItemInputRows(lines.length);
      switchInputMode('manual');
      announceLive(`Imported ${lines.length} items successfully.`);
    }

    function clearAllInputFieldsOnly() {
      const fields = document.querySelectorAll('.item-text-field');
      fields.forEach(f => f.value = '');
      bulkTextarea.value = '';
      state.items = [];
      announceLive("All item fields cleared.");
    }

    const samplePacks = {
      features: ["Real-time Collaboration", "Dark Mode Theme", "Export to CSV & PDF", "Keyboard Navigation"],
      life: ["Career Growth", "Physical Health", "Family Relationships", "Financial Security"],
      destinations: ["Kyoto, Japan", "Swiss Alps", "Reykjavik, Iceland", "Maui, Hawaii"]
    };

    function loadSample(key) {
      const sample = samplePacks[key];
      if (!sample) return;
      state.targetCount = sample.length;
      itemCountInput.value = sample.length;
      updateMatchupEstimate();
      state.items = [...sample];
      renderItemInputRows(sample.length);
      announceLive(`Loaded sample list with ${sample.length} items.`);
    }

    function generatePairs(n) {
      const pairList = [];
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          pairList.push([i, j]);
        }
      }
      return pairList;
    }

    // Step 3: Comparisons
    function startComparisonProcess() {
      const inputFields = document.querySelectorAll('.item-text-field');
      const enteredItems = [];

      inputFields.forEach((inp, idx) => {
        const val = inp.value.trim();
        if (val) {
          enteredItems.push(val);
        } else {
          enteredItems.push(`Option ${idx + 1}`);
        }
      });

      if (enteredItems.length < 3) {
        showToast('Please enter at least 3 items to rank.');
        return;
      }

      state.items = enteredItems;
      state.pairs = generatePairs(state.items.length);
      state.currentPairIndex = 0;
      state.scores = {};
      state.history = [];

      for (let i = 0; i < state.items.length; i++) {
        state.scores[i] = 0;
      }

      goToStep3();
    }

    function goToStep3() {
      updateFolderTabs(3);
      renderCurrentPair();
    }

    function renderCurrentPair() {
      const totalPairs = state.pairs.length;
      const index = state.currentPairIndex;

      if (index >= totalPairs) {
        showFinalRankings();
        return;
      }

      const [itemIdxA, itemIdxB] = state.pairs[index];
      const itemA = state.items[itemIdxA];
      const itemB = state.items[itemIdxB];

      document.getElementById('optionAText').textContent = itemA;
      document.getElementById('optionBText').textContent = itemB;

      const currentNumber = index + 1;
      const progressPercent = Math.round((index / totalPairs) * 100);

      document.getElementById('currentPairLabel').textContent = `Matchup ${currentNumber} of ${totalPairs}`;
      document.getElementById('centerMatchNumber').textContent = `${currentNumber} of ${totalPairs}`;
      document.getElementById('progressPercentLabel').textContent = `${progressPercent}% Completed`;
      document.getElementById('progressBarFill').style.width = `${progressPercent}%`;

      const progressBar = document.getElementById('rankingProgressBar');
      progressBar.setAttribute('aria-valuenow', progressPercent);

      document.getElementById('undoBtn').disabled = (state.history.length === 0);

      announceLive(`Matchup ${currentNumber} of ${totalPairs}: Option A is ${itemA}. Option B is ${itemB}.`);
    }

    function registerVote(winner) {
      if (state.currentPairIndex >= state.pairs.length) return;

      const [idxA, idxB] = state.pairs[state.currentPairIndex];
      let deltaA = 0;
      let deltaB = 0;

      if (winner === 'A') {
        deltaA = 1;
        state.scores[idxA] = (state.scores[idxA] || 0) + 1;
        playSound('voteA');
      } else if (winner === 'B') {
        deltaB = 1;
        state.scores[idxB] = (state.scores[idxB] || 0) + 1;
        playSound('voteB');
      } else if (winner === 'TIE') {
        deltaA = 0.5;
        deltaB = 0.5;
        state.scores[idxA] = (state.scores[idxA] || 0) + 0.5;
        state.scores[idxB] = (state.scores[idxB] || 0) + 0.5;
        playSound('tie');
      }

      state.history.push({
        pairIndex: state.currentPairIndex,
        winner,
        deltaA,
        deltaB,
        idxA,
        idxB
      });

      state.currentPairIndex++;
      renderCurrentPair();
    }

    function undoLastComparison() {
      if (state.history.length === 0) return;

      const last = state.history.pop();
      state.scores[last.idxA] -= last.deltaA;
      state.scores[last.idxB] -= last.deltaB;
      state.currentPairIndex = last.pairIndex;

      playSound('undo');
      announceLive("Previous choice reverted.");
      renderCurrentPair();
    }

    // Accessible Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (state.currentStep === 3) {
        if (e.key === '1' || e.key === 'ArrowLeft') {
          e.preventDefault();
          registerVote('A');
        } else if (e.key === '2' || e.key === 'ArrowRight') {
          e.preventDefault();
          registerVote('B');
        } else if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          registerVote('TIE');
        } else if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          undoLastComparison();
        } else if (e.key === 'Backspace') {
          e.preventDefault();
          undoLastComparison();
        }
      }
    });

    // Step 4: Results & Rankings
    function showFinalRankings() {
      goToStep4();
      playSound('fanfare');

      const totalMatchesPerItem = state.items.length - 1;

      const results = state.items.map((name, index) => {
        const score = state.scores[index] || 0;
        const winRate = totalMatchesPerItem > 0 ? (score / totalMatchesPerItem) * 100 : 0;
        return {
          index,
          name,
          score,
          winRate: Math.round(winRate),
          totalMatches: totalMatchesPerItem
        };
      });

      results.sort((a, b) => b.score - a.score);
      state.finalRankedList = results;

      const container = document.getElementById('rankingsContainer');
      container.innerHTML = '';

      results.forEach((item, rankIdx) => {
        const rank = rankIdx + 1;
        const row = document.createElement('li');
        row.className = 'group p-4 sm:p-5 rounded-2xl border transition flex items-center justify-between gap-4 ' +
          (rank === 1 ? 'bg-amber-50 border-amber-300 shadow-sm' :
           rank === 2 ? 'bg-slate-100 border-slate-300' :
           rank === 3 ? 'bg-orange-50 border-orange-200' :
           'bg-white border-slate-200');

        let badgeHtml = '';
        if (rank === 1) {
          badgeHtml = `<span class="w-8 h-8 rounded-full bg-amber-500 text-white font-extrabold text-xs flex items-center justify-center shadow" aria-label="Rank 1">#1</span>`;
        } else if (rank === 2) {
          badgeHtml = `<span class="w-8 h-8 rounded-full bg-slate-500 text-white font-extrabold text-xs flex items-center justify-center" aria-label="Rank 2">#2</span>`;
        } else if (rank === 3) {
          badgeHtml = `<span class="w-8 h-8 rounded-full bg-amber-800 text-white font-extrabold text-xs flex items-center justify-center" aria-label="Rank 3">#3</span>`;
        } else {
          badgeHtml = `<span class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center border border-slate-300" aria-label="Rank ${rank}">#${rank}</span>`;
        }

        row.innerHTML = `
          <div class="flex items-center space-x-3.5 min-w-0">
            ${badgeHtml}
            <div class="min-w-0">
              <h3 class="font-extrabold text-slate-900 text-base sm:text-lg truncate">
                ${item.name}
              </h3>
              <p class="text-xs font-medium text-slate-600">
                ${item.score} victories of ${item.totalMatches} matchups (${item.winRate}% win rate)
              </p>
            </div>
          </div>
          <div class="text-right shrink-0">
            <span class="text-base font-extrabold text-slate-900 font-mono">${item.score} pts</span>
            <div class="w-20 sm:w-24 bg-slate-200 h-2 rounded-full overflow-hidden mt-1" aria-hidden="true">
              <div class="h-full bg-blue-700 rounded-full" style="width: ${item.winRate}%"></div>
            </div>
          </div>
        `;

        container.appendChild(row);
      });

      announceLive("Ranking completed! Top ranked priority is " + results[0].name);
    }

    function goToStep4() {
      updateFolderTabs(4);
    }

    // Export Suite Implementations
    function getFormattedRankingsText() {
      if (!state.finalRankedList) return '';
      const lines = state.finalRankedList.map((item, idx) => {
        return `${idx + 1}. ${item.name} - ${item.score} pts (${item.winRate}% win rate)`;
      });
      return `PAIRWISE PRIORITY RANKINGS\n==========================\n\n` + 
             lines.join('\n') + 
             `\n\nGenerated with Pairwise Priority Ranker\nBy Dr. Chris Caulkins © 2026 All Rights Reserved\nwww.freerangethinker.org`;
    }

    function copyRankingsText() {
      if (!state.finalRankedList) return;
      const fullText = getFormattedRankingsText();

      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = fullText;
      tempTextArea.style.position = 'fixed';
      tempTextArea.style.left = '-999999px';
      tempTextArea.style.top = '-999999px';
      document.body.appendChild(tempTextArea);
      tempTextArea.focus();
      tempTextArea.select();

      try {
        const successful = document.execCommand('copy');
        const btnText = document.getElementById('copyBtnText');
        if (successful) {
          btnText.textContent = "Copied!";
          announceLive("Rankings successfully copied to clipboard.");
          setTimeout(() => {
            btnText.textContent = "Copy";
          }, 2000);
        }
      } catch (err) {
        showToast('Clipboard copy failed. Please select text manually.');
      } finally {
        document.body.removeChild(tempTextArea);
      }
    }

    function exportAsTxt() {
      if (!state.finalRankedList) return;
      const textContent = getFormattedRankingsText();
      const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'priority_rankings.txt';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      announceLive("Rankings downloaded as a text file.");
    }

    function exportAsCsv() {
      if (!state.finalRankedList) return;
      const headers = ['Rank', 'Item Name', 'Points / Victories', 'Win Rate (%)', 'Total Matchups'];
      const rows = state.finalRankedList.map((item, idx) => {
        const escapedName = `"${item.name.replace(/"/g, '""')}"`;
        return [idx + 1, escapedName, item.score, `${item.winRate}%`, item.totalMatches].join(',');
      });

      const csvContent = [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'priority_rankings.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      announceLive("Rankings downloaded as a CSV spreadsheet.");
    }

    function emailResults() {
      if (!state.finalRankedList) return;
      const subject = encodeURIComponent("Pairwise Priority Ranking Results");
      const body = encodeURIComponent(getFormattedRankingsText());
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    }

    function restartSameItems() {
      state.pairs = generatePairs(state.items.length);
      state.currentPairIndex = 0;
      state.scores = {};
      state.history = [];
      for (let i = 0; i < state.items.length; i++) {
        state.scores[i] = 0;
      }
      goToStep3();
      announceLive("Restarted comparisons with existing items.");
    }

    function startNewListCompletePurge() {
      // 1. Purge data
      state.items = [];
      state.pairs = [];
      state.currentPairIndex = 0;
      state.scores = {};
      state.history = [];
      state.finalRankedList = null;
      state.maxReachedStep = 1;
      state.targetCount = 4;

      // 2. Clear Step 1 input
      itemCountInput.value = 4;
      updateMatchupEstimate();

      // 3. Clear Step 2 containers
      manualContainer.innerHTML = '';
      bulkTextarea.value = '';
      switchInputMode('manual');

      // 4. Clear Step 3 displays
      document.getElementById('optionAText').textContent = '';
      document.getElementById('optionBText').textContent = '';
      document.getElementById('currentPairLabel').textContent = 'Matchup 1 of 6';
      document.getElementById('centerMatchNumber').textContent = '1 of 6';
      document.getElementById('progressPercentLabel').textContent = '0% Completed';
      document.getElementById('progressBarFill').style.width = '0%';
      document.getElementById('undoBtn').disabled = true;

      // 5. Clear Step 4 results
      document.getElementById('rankingsContainer').innerHTML = '';

      // 6. Return to Step 1
      updateFolderTabs(1);
      announceAlert("New list initialized. All previous items and results have been completely cleared.");

      setTimeout(() => {
        itemCountInput.focus();
        itemCountInput.select();
      }, 50);
    }

    // Initialize on page load
    updateMatchupEstimate();
  </script>
</body>
</html>
