<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pairwise Priority Ranker - Decision Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              800: '#1e3a8a',
              900: '#172554',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* WCAG 2.1 AA Focus Indicator */
    :focus-visible {
      outline: 3px solid #1d4ed8 !important;
      outline-offset: 3px !important;
    }

    /* Screen reader utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* File Folder Tabs Styling */
    .folder-tab-bar {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      position: relative;
      z-index: 10;
      margin-bottom: -1px;
      overflow-x: auto;
      padding-left: 8px;
      padding-right: 8px;
    }

    .folder-tab {
      position: relative;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      padding: 10px 18px;
      font-size: 0.8125rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      border-bottom: none;
      background-color: #e2e8f0;
      color: #475569;
      transition: background-color 0.15s ease, color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: default;
    }

    .folder-tab.tab-active {
      background-color: #ffffff;
      color: #0f172a;
      border-color: #94a3b8;
      border-bottom: 2px solid #ffffff;
      padding-top: 12px;
      padding-bottom: 12px;
      z-index: 20;
      box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.04);
    }

    .folder-tab.tab-completed {
      background-color: #f1f5f9;
      color: #1e3a8a;
    }

    .folder-tab.tab-interactive {
      cursor: pointer;
    }
    .folder-tab.tab-interactive:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .folder-sheet {
      border: 1px solid #94a3b8;
      background-color: #ffffff;
      border-radius: 0 16px 16px 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      position: relative;
      z-index: 5;
    }

    @media (max-width: 640px) {
      .folder-sheet {
        border-radius: 16px;
      }
      .folder-tab {
        padding: 8px 12px;
        font-size: 0.75rem;
      }
    }

    /* Support for prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }

    /* Native modal dialog backdrop */
    dialog::backdrop {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between antialiased selection:bg-blue-200 selection:text-blue-950">

  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-800 focus:text-white focus:rounded-md focus:shadow-xl focus:font-bold">
    Skip to main content
  </a>

  <!-- ARIA Live Announcements -->
  <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-alerts" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <!-- Header Banner -->
  <header role="banner" class="border-b border-slate-300 bg-white/95 backdrop-blur-sm sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-700 text-white flex items-center justify-center font-bold text-lg shadow-sm" aria-hidden="true">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" />
          </svg>
        </div>
        <div>
          <h1 class="font-extrabold text-lg text-slate-900 tracking-tight leading-tight">Pairwise Priority Ranker</h1>
          <p class="text-xs text-slate-600 font-medium">Head-to-Head Analytical Decision Matrix</p>
        </div>
      </div>

      <!-- Header Controls -->
      <div class="flex items-center space-x-2">
        <!-- Sound Toggle -->
        <button 
          id="soundToggleBtn" 
          onclick="toggleAudio()" 
          type="button"
          aria-pressed="true"
          aria-label="Sound effects are enabled. Click to mute sound."
          class="text-xs px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-800 hover:bg-slate-50 transition font-semibold flex items-center gap-1.5 shadow-sm"
        >
          <span id="soundIcon" aria-hidden="true">
            <svg class="w-4 h-4 text-emerald-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            </svg>
          </span>
          <span id="soundStatusText">Sound On</span>
        </button>

        <!-- Accessibility / ADA Statement Button -->
        <button 
          id="adaModalBtn" 
          onclick="openModal('adaModal')" 
          type="button"
          aria-haspopup="dialog"
          class="text-xs px-3 py-2 rounded-xl border border-blue-300 bg-blue-50/70 text-blue-900 hover:bg-blue-100 transition font-bold flex items-center gap-1.5 shadow-sm"
        >
          <svg class="w-4 h-4 text-blue-700" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
          </svg>
          <span>ADA &amp; Accessibility</span>
        </button>

        <!-- How It Works Instructions Button -->
        <button 
          id="howItWorksBtn" 
          onclick="openModal('infoModal')" 
          type="button"
          aria-haspopup="dialog"
          class="text-xs px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition font-semibold flex items-center gap-1.5 shadow-sm"
        >
          <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Instructions</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="main-content" role="main" class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 flex flex-col justify-start">
    
    <!-- File Folder Navigation Tabs -->
    <nav aria-label="Ranking Workflow Stages">
      <div class="folder-tab-bar" role="tablist">
        <button 
          id="tab-btn-1" 
          role="tab" 
          aria-selected="true" 
          aria-controls="step-1" 
          tabindex="0"
          onclick="handleTabClick(1)"
          class="folder-tab tab-active"
        >
          <span class="w-4 h-4 rounded-full bg-blue-700 text-white text-[10px] flex items-center justify-center font-bold" aria-hidden="true">1</span>
          <span>1. Setup &amp; Count</span>
        </button>

        <button 
          id="tab-btn-2" 
          role="tab" 
          aria-selected="false" 
          aria-controls="step-2" 
          tabindex="-1"
          onclick="handleTabClick(2)"
          class="folder-tab"
        >
          <span class="w-4 h-4 rounded-full bg-slate-400 text-white text-[10px] flex items-center justify-center font-bold" aria-hidden="true">2</span>
          <span>2. Enter Items</span>
        </button>

        <button 
          id="tab-btn-3" 
          role="tab" 
          aria-selected="false" 
          aria-controls="step-3" 
          tabindex="-1"
          onclick="handleTabClick(3)"
          class="folder-tab"
        >
          <span class="w-4 h-4 rounded-full bg-slate-400 text-white text-[10px] flex items-center justify-center font-bold" aria-hidden="true">3</span>
          <span>3. Pairwise Compare</span>
        </button>

        <button 
          id="tab-btn-4" 
          role="tab" 
          aria-selected="false" 
          aria-controls="step-4" 
          tabindex="-1"
          onclick="handleTabClick(4)"
          class="folder-tab"
        >
          <span class="w-4 h-4 rounded-full bg-slate-400 text-white text-[10px] flex items-center justify-center font-bold" aria-hidden="true">4</span>
          <span>4. Ranked Results</span>
        </button>
      </div>
    </nav>

    <!-- Error/Validation Banner -->
    <div id="toastMessage" role="alert" class="hidden mb-4 p-3.5 bg-red-50 border-2 border-red-300 text-red-900 text-sm font-semibold rounded-xl flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-red-700 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="toastText">Validation alert</span>
      </div>
      <button onclick="dismissToast()" type="button" aria-label="Dismiss error message" class="text-red-800 hover:text-red-950 p-1 font-bold text-lg leading-none">&times;</button>
    </div>

    <!-- Active Folder Sheet -->
    <div class="folder-sheet p-6 sm:p-10">

      <!-- ================= STEP 1: SETUP & COUNT ================= -->
      <section id="step-1" role="tabpanel" aria-labelledby="tab-btn-1" class="transition-opacity duration-200">
        <div class="max-w-xl mx-auto text-center">
          <span class="inline-block px-3 py-1 bg-blue-100 text-blue-900 text-xs font-bold rounded-full uppercase tracking-wider mb-2">
            Phase 1 &bull; Configuration
          </span>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
            How many items do you want to rank?
          </h2>
          <p class="text-slate-700 mt-2 text-sm sm:text-base leading-relaxed">
            Choose the number of items on your list. Each item will be paired head-to-head with every other item sequentially to uncover your true hierarchy of importance.
          </p>

          <form onsubmit="event.preventDefault(); goToStep2();" class="mt-8 flex flex-col items-center">
            <div class="flex flex-col items-center">
              <label for="itemCountInput" class="text-sm font-bold text-slate-800 mb-2">
                Number of Items (3 to 20):
              </label>
              <div class="flex items-center justify-center space-x-3">
                <button 
                  type="button" 
                  onclick="adjustCount(-1)" 
                  aria-label="Decrease item count by 1"
                  class="w-12 h-12 rounded-2xl border-2 border-slate-300 bg-white text-slate-800 hover:bg-slate-100 flex items-center justify-center text-2xl font-bold transition active:scale-95 shadow-sm"
                >
                  &minus;
                </button>
                <input 
                  type="number" 
                  id="itemCountInput" 
                  name="itemCountInput"
                  min="3" 
                  max="20" 
                  value="4" 
                  required
                  aria-describedby="matchupEstimate"
                  class="w-24 h-12 text-center text-2xl font-bold font-mono rounded-2xl border-2 border-slate-400 focus:border-blue-700 text-slate-950 transition"
                >
                <button 
                  type="button" 
                  onclick="adjustCount(1)" 
                  aria-label="Increase item count by 1"
                  class="w-12 h-12 rounded-2xl border-2 border-slate-300 bg-white text-slate-800 hover:bg-slate-100 flex items-center justify-center text-2xl font-bold transition active:scale-95 shadow-sm"
                >
                  &#43;
                </button>
              </div>
            </div>

            <!-- Preset count choices (5 items removed as requested) -->
            <fieldset class="mt-5">
              <legend class="sr-only">Preset list sizes</legend>
              <div class="flex flex-wrap items-center justify-center gap-2 text-xs font-semibold text-slate-700">
                <span class="text-slate-500 font-normal">Presets:</span>
                <button type="button" onclick="setQuickCount(3)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-blue-50 text-slate-800 hover:text-blue-900 transition">3 items (3 matches)</button>
                <button type="button" onclick="setQuickCount(4)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-blue-50 text-slate-800 hover:text-blue-900 transition">4 items (6 matches)</button>
                <button type="button" onclick="setQuickCount(6)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-blue-50 text-slate-800 hover:text-blue-900 transition">6 items (15 matches)</button>
                <button type="button" onclick="setQuickCount(8)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-blue-50 text-slate-800 hover:text-blue-900 transition">8 items (28 matches)</button>
                <button type="button" onclick="setQuickCount(10)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-blue-50 text-slate-800 hover:text-blue-900 transition">10 items (45 matches)</button>
              </div>
            </fieldset>

            <div id="matchupEstimate" class="mt-5 text-sm font-semibold text-blue-900 bg-blue-50 border border-blue-200 px-4 py-2 rounded-xl inline-block" aria-live="polite">
              4 items will generate 6 pairwise comparisons.
            </div>

            <div class="mt-8">
              <button 
                type="submit" 
                class="px-8 py-3.5 bg-blue-700 hover:bg-blue-800 text-white text-sm font-bold rounded-2xl shadow-md transition active:scale-95 flex items-center gap-2"
              >
                <span>Continue to Enter Items</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- ================= STEP 2: ENTER ITEMS ================= -->
      <section id="step-2" role="tabpanel" aria-labelledby="tab-btn-2" class="hidden transition-opacity duration-200">
        <div class="max-w-2xl mx-auto">
          <div class="flex items-center justify-between mb-4">
            <button 
              type="button" 
              onclick="goToStep1()" 
              class="text-xs font-bold text-slate-700 hover:text-blue-800 flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-white transition"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
              </svg>
              Adjust Count
            </button>
            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-900 text-xs font-bold rounded-full uppercase tracking-wider">
              Phase 2 &bull; Items Definition
            </span>
          </div>

          <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight text-center">
            Name your list items
          </h2>
          <p class="text-slate-700 mt-1 text-center text-sm">
            Enter each choice or topic clearly below.
          </p>

          <!-- Input Method Toggle -->
          <div class="flex justify-center mt-6 mb-5" role="group" aria-label="Input Method Selection">
            <div class="bg-slate-200 p-1 rounded-xl flex text-xs font-bold">
              <button 
                id="tabManual" 
                type="button"
                aria-pressed="true"
                onclick="switchInputMode('manual')" 
                class="px-4 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition"
              >
                Individual Fields
              </button>
              <button 
                id="tabPaste" 
                type="button"
                aria-pressed="false"
                onclick="switchInputMode('paste')" 
                class="px-4 py-2 rounded-lg text-slate-700 hover:text-slate-950 transition"
              >
                Bulk Paste
              </button>
            </div>
          </div>

          <!-- Dynamic Individual Fields -->
          <div id="manualInputContainer" class="space-y-3 max-h-[380px] overflow-y-auto pr-2 custom-scroll" role="group" aria-label="Individual list item inputs">
            <!-- Programmatically injected -->
          </div>

          <!-- Bulk Paste Textarea -->
          <div id="bulkInputContainer" class="hidden">
            <label for="bulkTextarea" class="block text-xs font-bold text-slate-800 mb-1.5">
              Paste or type items with one item on each line:
            </label>
            <textarea 
              id="bulkTextarea" 
              rows="7" 
              placeholder="Item 1&#10;Item 2&#10;Item 3&#10;Item 4" 
              class="w-full p-3.5 text-sm font-medium rounded-2xl border-2 border-slate-300 focus:border-blue-700 text-slate-900 leading-relaxed font-sans"
            ></textarea>
            <button 
              type="button" 
              onclick="parseBulkInput()" 
              class="mt-2.5 px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-xs font-bold text-slate-800 transition"
            >
              Parse &amp; Populate Fields
            </button>
          </div>

          <!-- Samples & Clear Helpers -->
          <div class="mt-6 pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-1.5 text-slate-600 font-medium">
              <span>Sample lists:</span>
              <button type="button" onclick="loadSample('features')" class="text-blue-700 hover:underline font-bold">Features</button>
              <span aria-hidden="true">&bull;</span>
              <button type="button" onclick="loadSample('life')" class="text-blue-700 hover:underline font-bold">Life Priorities</button>
              <span aria-hidden="true">&bull;</span>
              <button type="button" onclick="loadSample('destinations')" class="text-blue-700 hover:underline font-bold">Travel</button>
            </div>
            <button 
              type="button" 
              onclick="clearAllInputFieldsOnly()" 
              class="text-red-700 hover:text-red-900 font-semibold px-2 py-1 rounded transition hover:bg-red-50"
            >
              Clear Fields
            </button>
          </div>

          <div class="mt-8 flex justify-center">
            <button 
              type="button" 
              onclick="startComparisonProcess()" 
              class="w-full sm:w-auto px-8 py-3.5 bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2"
            >
              <span>Begin Head-to-Head Comparisons</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ================= STEP 3: PAIRWISE COMPARISONS ================= -->
      <section id="step-3" role="tabpanel" aria-labelledby="tab-btn-3" class="hidden transition-opacity duration-200">
        <div class="max-w-2xl mx-auto">
          
          <!-- Matchup Status Headers -->
          <div class="flex items-center justify-between mb-2 text-xs font-bold text-slate-700">
            <span id="currentPairLabel">Matchup 1 of 6</span>
            <span id="progressPercentLabel">0% Completed</span>
          </div>

          <!-- Visual Progress Bar -->
          <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden mb-6" role="progressbar" id="rankingProgressBar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Ranking comparison progress">
            <div id="progressBarFill" class="bg-blue-700 h-full rounded-full transition-all duration-300 w-0"></div>
          </div>

          <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 bg-amber-100 text-amber-900 border border-amber-300 text-xs font-bold rounded-full mb-2">
              Decision Point
            </span>
            <h2 id="comparisonPromptHeading" class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
              Which item is more important to you?
            </h2>
            <p class="text-xs text-slate-600 mt-1 font-medium">
              Activate your choice below, or use keyboard keys <kbd class="px-1.5 py-0.5 bg-slate-200 border border-slate-300 rounded font-mono font-bold text-slate-800">[1]</kbd> / <kbd class="px-1.5 py-0.5 bg-slate-200 border border-slate-300 rounded font-mono font-bold text-slate-800">[&larr;]</kbd> for Option A, or <kbd class="px-1.5 py-0.5 bg-slate-200 border border-slate-300 rounded font-mono font-bold text-slate-800">[2]</kbd> / <kbd class="px-1.5 py-0.5 bg-slate-200 border border-slate-300 rounded font-mono font-bold text-slate-800">[&rarr;]</kbd> for Option B.
            </p>
          </div>

          <!-- Decision Cards with Centered Match Indicator -->
          <div class="relative grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 my-6 items-stretch" role="group" aria-labelledby="comparisonPromptHeading">
            
            <!-- Choice A Card -->
            <button 
              id="choiceBtnA" 
              type="button" 
              onclick="registerVote('A')" 
              aria-keyshortcuts="1 LeftArrow"
              aria-describedby="optionAText"
              class="group relative text-left p-6 sm:p-7 rounded-2xl border-2 border-slate-300 hover:border-blue-700 bg-white hover:bg-blue-50/50 transition flex flex-col justify-between shadow-sm active:scale-[0.98] min-h-[175px]"
            >
              <div class="flex items-center justify-between w-full">
